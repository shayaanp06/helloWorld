<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Shayaan Paracha{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Shayaan Paracha</a>

            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('favorite_course') }}">
                    Favorite Course
                </a>
                <a class="nav-link" href="{{ url_for('contact') }}">
                    Contact
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">Shayaan Paracha | BMGT407 Flask Application</p>
    </footer>

</body>
</html>
